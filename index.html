<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявки на доступы к системам</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --line:#e2e6ec; --text:#1f2733;
    --muted:#6b7684; --accent:#2563eb; --accent-d:#1d4ed8;
    --ok:#16a34a; --ok-bg:#e7f6ec; --pending:#b45309; --pending-bg:#fdf0d9;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:20px 24px}
  header h1{margin:0;font-size:20px}
  header p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .wrap{max-width:960px;margin:0 auto;padding:24px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:14px 18px;margin-bottom:20px;box-shadow:var(--shadow)}
  .bar .prog{font-size:14px;color:var(--muted)}
  .bar .prog b{color:var(--text)}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .card .top{display:flex;align-items:center;gap:12px}
  .card .ic{width:42px;height:42px;border-radius:10px;background:#eef2ff;
    display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .card h3{margin:0;font-size:16px}
  .card .desc{color:var(--muted);font-size:13px;margin:0}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:3px 10px;border-radius:99px;width:fit-content}
  .status.pending{color:var(--pending);background:var(--pending-bg)}
  .status.done{color:var(--ok);background:var(--ok-bg)}
  .status.locked{color:var(--muted);background:#eef1f5}
  .card.locked{opacity:.72}
  button:disabled{opacity:.5;cursor:not-allowed}
  .card .acts{display:flex;gap:8px;margin-top:auto}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;
    padding:9px 14px;font-size:14px;font-weight:500;transition:.12s}
  .btn-p{background:var(--accent);color:#fff}
  .btn-p:hover{background:var(--accent-d)}
  .btn-s{background:#fff;color:var(--text);border-color:var(--line)}
  .btn-s:hover{background:#f8fafc}
  .btn-sm{padding:7px 12px;font-size:13px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--card);border-radius:14px;width:100%;max-width:560px;
    box-shadow:0 20px 40px rgba(16,24,40,.2)}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal .mh h2{margin:0;font-size:17px}
  .modal .mh .x{background:none;border:none;font-size:22px;color:var(--muted);padding:0 4px}
  .modal .mb{padding:22px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field .req{color:#dc2626}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;
    border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;
    border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .field .err{color:#dc2626;font-size:12px;margin-top:4px;display:none}
  .field.invalid input,.field.invalid select{border-color:#dc2626}
  .field.invalid .err{display:block}
  .modal .mf{display:flex;justify-content:flex-end;gap:10px;
    padding:16px 22px;border-top:1px solid var(--line)}
  .hint{font-size:12px;color:var(--muted);margin:-6px 0 14px}
  /* tabs */
  .tabs{display:inline-flex;background:#eef1f5;border:1px solid var(--line);
    border-radius:10px;padding:4px;gap:4px;margin-bottom:20px}
  .tab{background:none;border:none;color:var(--muted);font-weight:600;
    padding:8px 18px;border-radius:7px}
  .tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
  .pane{display:none}
  .pane.active{display:block}
  .lead{margin:0 0 18px;color:var(--muted);font-size:14px}
  .placeholder{background:var(--card);border:1px dashed var(--line);border-radius:12px;
    padding:32px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Заявки на доступы к системам</h1>
  <p>Заполните заявки на нужные системы — по каждой сформируется файл для скачивания.</p>
</header>

<div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="new"     onclick="switchTab('new')">Новый сотрудник</button>
    <button class="tab"        data-tab="current" onclick="switchTab('current')">Действующий сотрудник</button>
  </div>

  <!-- Вкладка: новый сотрудник — полный чек-лист заявок -->
  <div class="pane active" id="pane-new">
    <p class="lead">Вы недавно устроились — оформите заявки на доступы ко всем необходимым системам.</p>
    <div class="bar">
      <div class="prog">Оформлено: <b id="progText">0 из 0</b></div>
      <div class="tools">
        <button class="btn-s btn-sm" onclick="loadExample()">Загрузить пример</button>
        <button class="btn-s btn-sm" onclick="exportJson()">Экспорт JSON</button>
        <button class="btn-s btn-sm" onclick="document.getElementById('imp').click()">Импорт JSON</button>
        <input id="imp" type="file" accept="application/json" hidden onchange="importJson(this)">
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Вкладка: действующий сотрудник — все системы доступны сразу, без последовательности -->
  <div class="pane" id="pane-current">
    <p class="lead">Вы уже работаете в организации — оформляйте доступ к любым системам в любом порядке.</p>
    <div class="grid" id="grid-current"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mh"><h2 id="mTitle"></h2><button class="x" onclick="closeModal()">&times;</button></div>
    <div class="mb"><p class="hint" id="mHint"></p><form id="mForm"></form></div>
    <div class="mf">
      <button class="btn-s" onclick="closeModal()">Отмена</button>
      <button class="btn-p" onclick="saveAndDownload()">Сохранить и скачать</button>
    </div>
  </div>
</div>

  for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();

function b64ToBytes(b64){const bin=atob(b64);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function readZip(bytes){
  const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  let eocd=-1;
  for(let i=bytes.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error('EOCD not found');
  const cdCount=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true);
  const entries=[];
  for(let n=0;n<cdCount;n++){
    if(dv.getUint32(off,true)!==0x02014b50)throw new Error('bad CD');
    const method=dv.getUint16(off+10,true), crc=dv.getUint32(off+16,true);
    const compSize=dv.getUint32(off+20,true), uncompSize=dv.getUint32(off+24,true);
    const nameLen=dv.getUint16(off+28,true), extraLen=dv.getUint16(off+30,true), commentLen=dv.getUint16(off+32,true);
    const localOff=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(bytes.subarray(off+46,off+46+nameLen));
    const lNameLen=dv.getUint16(localOff+26,true), lExtraLen=dv.getUint16(localOff+28,true);
    const dataStart=localOff+30+lNameLen+lExtraLen;
    entries.push({name,method,crc,compSize,uncompSize,comp:bytes.subarray(dataStart,dataStart+compSize)});
    off+=46+nameLen+extraLen+commentLen;
  }
  return entries;
}
function xmlEscape(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fillEntry(e,values){
  let text=new TextDecoder().decode(e.comp);
  text=text.replace(/\{\{([A-Z0-9_]+)\}\}/g,(m,k)=>Object.prototype.hasOwnProperty.call(values,k)?xmlEscape(values[k]):m);
  const data=new TextEncoder().encode(text);
  return {name:e.name,method:0,crc:crc32(data),compSize:data.length,uncompSize:data.length,comp:data};
}
function writeZip(entries){
  const chunks=[],central=[],enc=new TextEncoder(); let offset=0;
  for(const e of entries){
    const nb=enc.encode(e.name);
    const lh=new Uint8Array(30+nb.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(8,e.method,true);
    dv.setUint16(12,0x21,true);dv.setUint32(14,e.crc,true);dv.setUint32(18,e.compSize,true);
    dv.setUint32(22,e.uncompSize,true);dv.setUint16(26,nb.length,true);lh.set(nb,30);
    chunks.push(lh,e.comp);
    const cd=new Uint8Array(46+nb.length), cdv=new DataView(cd.buffer);
    cdv.setUint32(0,0x02014b50,true);cdv.setUint16(4,20,true);cdv.setUint16(6,20,true);
    cdv.setUint16(10,e.method,true);cdv.setUint16(14,0x21,true);cdv.setUint32(16,e.crc,true);
    cdv.setUint32(20,e.compSize,true);cdv.setUint32(24,e.uncompSize,true);
    cdv.setUint16(28,nb.length,true);cdv.setUint32(42,offset,true);cd.set(nb,46);
    central.push(cd); offset+=lh.length+e.comp.length;
  }
  const cdStart=offset; let cdSize=0; for(const c of central)cdSize+=c.length;
  const eocd=new Uint8Array(22),edv=new DataView(eocd.buffer);
  edv.setUint32(0,0x06054b50,true);edv.setUint16(8,entries.length,true);edv.setUint16(10,entries.length,true);
  edv.setUint32(12,cdSize,true);edv.setUint32(16,cdStart,true);
  const all=[...chunks,...central,eocd]; let total=0; for(const a of all)total+=a.length;
  const out=new Uint8Array(total); let p=0; for(const a of all){out.set(a,p);p+=a.length;}
  return out;
}
function fillTemplate(b64, values, textParts){
  const entries=readZip(b64ToBytes(b64));
  return writeZip(entries.map(e=>textParts.includes(e.name)?fillEntry(e,values):e));
}
</script>

<script>
/* ==========================================================================
   КОНФИГ СИСТЕМ (реальные заявки по шаблонам из types/).
   Каждая система:
     - fields:     поля модального окна;
     - template:   ключ в window.TEMPLATES (встроенный шаблон) или null, если
                   шаблон ещё не размечен (кнопка будет неактивна);
     - textParts:  какие части шаблона заполняются метками (по умолч. document.xml);
     - fileName(d):имя скачиваемого файла;
     - mapValues(d): значения полей → метки {{TOKEN}} шаблона.
   Разметка меток шаблона — в build/build.py (имена токенов должны совпадать).
   ========================================================================== */

const DOCX_PART = ['word/document.xml'];

const SYSTEMS = [
  {
    id:'ai_lab', title:'Лаборатория ИИ', icon:'🧪', requires:[],
    desc:'Управление доступом к стенду «Лаборатория искусственного интеллекта».',
    template:'ai_lab', textParts:DOCX_PART,
    fields:[
      {name:'podr',      label:'Наименование структурного подразделения', type:'text', required:true},
      {name:'fio_rab',   label:'Ф.И.О. работника', type:'text', required:true, placeholder:'Иванов Иван Иванович'},
      {name:'post_rab',  label:'Должность работника', type:'text', required:true},
      {name:'phone_rab', label:'Телефон работника', type:'text', required:false},
      {name:'fio_ruk',   label:'Ф.И.О. руководителя', type:'text', required:true},
      {name:'post_ruk',  label:'Должность руководителя', type:'text', required:true},
      {name:'phone_ruk', label:'Телефон руководителя', type:'text', required:false},
      {name:'key',       label:'Имя ключа ПКЗИ', type:'text', required:false},
    ],
    fileName:d => `Заявка_ЛабИИ_${safe(d.fio_rab)}.docx`,
    mapValues:d => {
      const now = new Date();
      const M = ['января','февраля','марта','апреля','мая','июня',
                 'июля','августа','сентября','октября','ноября','декабря'];
      const day = String(now.getDate());
      const mon = M[now.getMonth()];
      const ys  = String(now.getFullYear()).slice(2);       // суффикс года, напр. "26"
      const ye  = String(now.getFullYear() + 1).slice(2);   // тот же день через год
      const join = (...p) => p.filter(Boolean).join(', ');
      return {
        PODR:d.podr,
        RAB: join(d.fio_rab, d.post_rab, d.phone_rab),
        RUK: join(d.fio_ruk, d.post_ruk, d.phone_ruk),
        KEY: d.key,
        // срок действия: сегодня → тот же день следующего года
        D_START:day, M_START:mon, Y_START:ys,
        D_END:day,   M_END:mon,   Y_END:ye,
        // «Ознакомлен…»: ФИО работника + дата заполнения
        FIO_RAB_SIGN:d.fio_rab, D_SIGN:day, M_SIGN:mon, Y_SIGN:ys,
        // «Согласовано…»: подразделение + ФИО руководителя
        PODR_SIGN:d.podr, FIO_RUK_SIGN:d.fio_ruk,
      };
    }
  },
  {
    id:'pkzi', title:'Ключевая информация ПКЗИ', icon:'🔑', requires:[],
    desc:'Заявка на первичную генерацию ключевой информации ПКЗИ.',
    template:null, textParts:DOCX_PART, fields:[], fileName:d=>'', mapValues:d=>({})
  },
  {
    id:'vipnet', title:'VipNet / Деловая почта', icon:'✉️', requires:[],
    desc:'Создание абонентского пункта «VipNet» (ПО «Деловая почта»).',
    template:null, textParts:DOCX_PART, fields:[], fileName:d=>'', mapValues:d=>({})
  },
  {
    id:'vkd', title:'ВКД', icon:'🗄️', requires:[],
    desc:'Доступ к ИС «Виртуальные комнаты данных».',
    template:null, textParts:['xl/sharedStrings.xml'], fields:[], fileName:d=>'', mapValues:d=>({})
  },
];

/* ========================= ХРАНЕНИЕ СОСТОЯНИЯ ============================ */
const LS_KEY = 'access-requests-v1';
let store = load();
function load(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}catch(e){return {}} }
function persist(){ localStorage.setItem(LS_KEY, JSON.stringify(store)) }

/* ============================== ВКЛАДКИ ================================= */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active', p.id==='pane-'+name));
}

/* ============================ ОТРИСОВКА ================================= */
// gated=true (новый сотрудник) — учитываем зависимости requires.
// gated=false (действующий) — все системы доступны сразу.
function isDone(id){ return !!store[id]; }
function missingReqs(s, gated){
  if(!gated) return [];
  return (s.requires||[]).filter(id=>!isDone(id));
}

function render(){
  renderGrid('grid', true);       // вкладка «Новый сотрудник» — с последовательностью
  renderGrid('grid-current', false); // вкладка «Действующий сотрудник» — без последовательности
  const n = SYSTEMS.filter(s=>isDone(s.id)).length;
  document.getElementById('progText').textContent = `${n} из ${SYSTEMS.length}`;
}

function renderGrid(containerId, gated){
  const grid = document.getElementById(containerId);
  if(!grid) return;
  grid.innerHTML = '';
  SYSTEMS.forEach(s=>{
    const done = isDone(s.id);
    const miss = missingReqs(s, gated);
    const locked = !done && miss.length>0;
    const card = document.createElement('div');
    card.className = 'card' + ((locked || (!done && !s.template))?' locked':'');
    let statusHtml, actsHtml;
    if(done){
      statusHtml = `<span class="status done">✓ Оформлено</span>`;
      actsHtml = `<button class="btn-p btn-sm" onclick="openModal('${s.id}')">Изменить</button>
                  <button class="btn-s btn-sm" onclick="redownload('${s.id}')">Скачать файл</button>`;
    } else if(locked){
      const names = miss.map(id=>SYSTEMS.find(x=>x.id===id).title).join(', ');
      statusHtml = `<span class="status locked">🔒 Сначала: ${names}</span>`;
      actsHtml = `<button class="btn-p btn-sm" disabled>Заполнить</button>`;
    } else if(!s.template){
      statusHtml = `<span class="status locked">🛠 Шаблон в подготовке</span>`;
      actsHtml = `<button class="btn-p btn-sm" disabled>Заполнить</button>`;
    } else {
      statusHtml = `<span class="status pending">● Не оформлено</span>`;
      actsHtml = `<button class="btn-p btn-sm" onclick="openModal('${s.id}')">Заполнить</button>`;
    }
    card.innerHTML = `
      <div class="top">
        <div class="ic">${s.icon}</div>
        <div><h3>${s.title}</h3></div>
      </div>
      <p class="desc">${s.desc}</p>
      ${statusHtml}
      <div class="acts">${actsHtml}</div>`;
    grid.appendChild(card);
  });
}

/* ============================== МОДАЛКА ================================= */
let current = null;
function openModal(id){
  current = SYSTEMS.find(s=>s.id===id);
  const saved = store[id]||{};
  document.getElementById('mTitle').textContent = current.title;
  document.getElementById('mHint').textContent = 'Заполните поля. После сохранения файл заявки скачается автоматически.';
  const form = document.getElementById('mForm');
  form.innerHTML = current.fields.map(f=>`
    <div class="field" data-name="${f.name}">
      <label>${f.label}${f.required?' <span class="req">*</span>':''}</label>
      ${fieldControl(f, saved[f.name]??'')}
      <div class="err">Поле обязательно для заполнения</div>
    </div>`).join('');
  document.getElementById('overlay').classList.add('open');
}
function fieldControl(f, val){
  const v = String(val).replace(/"/g,'&quot;');
  if(f.type==='textarea') return `<textarea name="${f.name}" rows="3">${val||''}</textarea>`;
  if(f.type==='select') return `<select name="${f.name}">${
    (f.options||[]).map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
  return `<input name="${f.name}" type="${f.type||'text'}" value="${v}" placeholder="${f.placeholder||''}">`;
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); current=null; }

function saveAndDownload(){
  const form = document.getElementById('mForm');
  const data = {}; let ok = true;
  current.fields.forEach(f=>{
    const wrap = form.querySelector(`[data-name="${f.name}"]`);
    const el = form.elements[f.name];
    data[f.name] = (el.value||'').trim();
    const bad = f.required && !data[f.name];
    wrap.classList.toggle('invalid', bad);
    if(bad) ok = false;
  });
  if(!ok) return;
  store[current.id] = data; persist();
  downloadRequest(current, data);
  closeModal(); render();
}
function redownload(id){ const s=SYSTEMS.find(x=>x.id===id); downloadRequest(s, store[id]); }

/* ===================== ГЕНЕРАЦИЯ ФАЙЛА ЗАЯВКИ =========================== */
// Заполняем встроенный шаблон значениями полей и скачиваем готовый .docx/.xlsx.
function downloadRequest(sys, data){
  const b64 = (window.TEMPLATES||{})[sys.template];
  if(!b64){ alert('Шаблон для этой заявки ещё не подключён.'); return; }
  const bytes = fillTemplate(b64, sys.mapValues(data), sys.textParts);
  const isXlsx = sys.textParts.some(p=>p.startsWith('xl/'));
  const mime = isXlsx
    ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  const blob = new Blob([bytes], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = sys.fileName(data);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ===================== ПРИМЕР ДАННЫХ (структура JSON) ================== */
// Демонстрирует ожидаемую структуру: { "<id системы>": { "<поле>": "значение" } }.
// Дублирует файл заявки.example.json (fetch с file:// заблокирован, поэтому встроено).
const EXAMPLE = {
  ai_lab:{
    podr:'Группа сопровождения ИС',
    fio_rab:'Петров Пётр Петрович', post_rab:'инженер', phone_rab:'+7 900 000-11-22',
    fio_ruk:'Сидоров Сидор Сидорович', post_ruk:'начальник отдела', phone_ruk:'+7 900 000-33-44',
    key:'StroyKontrol_PetrovPP'
  }
};
function loadExample(){
  if(Object.keys(store).length && !confirm('Заменить текущие данные примером?')) return;
  store = JSON.parse(JSON.stringify(EXAMPLE)); persist(); render();
}

/* ========================= ЭКСПОРТ / ИМПОРТ ============================ */
function exportJson(){
  const blob = new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='заявки.json'; a.click();
}
function importJson(input){
  const file = input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ store=JSON.parse(r.result); persist(); render(); }
    catch(e){ alert('Не удалось прочитать файл JSON'); } };
  r.readAsText(file); input.value='';
}

/* =============================== УТИЛ ================================== */
function safe(s){ return String(s||'без_имени').replace(/[^\wА-Яа-яЁё]+/g,'_').slice(0,40); }

render();
</script>
</body>
</html>
